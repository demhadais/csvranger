[package]
name = "csvranger"
version = "0.1.0"
edition = "2024"
authors = ["Ahmed Said"]
description = "A Rust library for parsing the output CSV files of 10x Genomics *ranger pipelines with Python bindings."
repository = "https://github.com/demhadais/csvranger"
license = "MIT"

[dependencies]
csv = "1.4.0"
regex = { version = "1.12.3", features = ["perf-dfa-full"] }
serde = {version = "1.0.228", optional = true, features = ["derive"]}

[features]
serde = ["dep:serde"]
