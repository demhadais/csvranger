[package]
name = "csvranger"
version = "0.3.0"
edition = "2024"
authors = ["Ahmed Said"]
description = "A library for parsing the output CSV files of 10x Genomics *ranger pipelines with Python bindings."
repository = "https://github.com/demhadais/csvranger"
license = "MIT"

[dependencies]
regex = { version = "1.12.4", features = ["perf-dfa-full"], optional = true }
schemars = { version = "1.2.1", optional = true }
serde = {version = "1.0.228", optional = true, features = ["derive"]}

[features]
serde = ["dep:serde"]
schemars = ["dep:schemars", "dep:serde"]
legacy = ["dep:regex"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
csv = "1.4.0"
